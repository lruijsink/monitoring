services:
  loki:
    image: grafana/loki:latest
    pull_policy: always
    command: -config.file=/etc/loki/loki-config.yaml
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - ./data:/loki
    networks: [monitoring]
