global:
  scrape_interval: 15s

scrape_configs:
  - job_name: projects
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
    relabel_configs:
      # Opt-in: only containers with a prometheus.port label
      - source_labels: [__meta_docker_container_label_prometheus_port]
        regex: .+
        action: keep

      # Only containers on the monitoring network, so the IP is reachable
      - source_labels: [__meta_docker_network_name]
        regex: monitoring
        action: keep

      # Address = container IP + prometheus.port label
      - source_labels: [__meta_docker_network_ip, __meta_docker_container_label_prometheus_port]
        separator: ":"
        regex: (.+):(.+)
        replacement: $1:$2
        target_label: __address__

      # Labels from Compose, instead of a hand-written labels block
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label: project
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
